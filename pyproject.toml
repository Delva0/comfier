[project]
name = "comani"
version = "0.5.0"
description = "Eager Python SDK and native ComfyUI runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.11", "cloudpickle>=3.1"]

[project.scripts]
comani = "comani.cli:main"

[project.optional-dependencies]
zmq = ["pyzmq>=27"]
lz4 = ["lz4>=4.3"]
test = ["pytest>=9.0", "pytest-asyncio>=1.3", "Pillow>=10.1", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comani"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "native: requires the configured ComfyUI checkout and its dependencies",
  "gpu: exercises a real CUDA device",
  "model: loads existing local model weights",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
